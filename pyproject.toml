[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "OpenSTRAN"
dynamic = ["version"]
authors = [
  { name="Xavier Montoya, PE", email="openstruct@os.mozmail.com" },
]
description = "Open source structural analysis with Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scipy>=1.17.1",
    "numpy>=2.4.1",
]
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["Structural Engineering", "Structural Analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]
[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=1.25",
]
[project.urls]
Homepage = "https://github.com/3l-Sabio/OpenSTRAN"
Documentation = "https://openSTRAN.readthedocs.io"
Issues = "https://github.com/3l-Sabio/OpenSTRAN/issues"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
